<!DOCTYPE html>
<!-- 模块：大屏稿 A v2（高密度·信息架构升级）。职责：左侧可折叠筛选抽屉 + 中央圆形地球 + 右侧 2×3 面板网格 + 顶/底工具条，供用户评审。零依赖，双击可开，假数据。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>热点采集网络 · 大屏稿 A v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:#060a12;color:#cdd9ee;font:13px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif;min-width:1180px;display:flex;flex-direction:column;height:100vh}
/* 顶栏 */
header{height:44px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid rgba(120,180,255,.18);background:linear-gradient(180deg,rgba(28,58,106,.5),rgba(6,10,18,0))}
header h1{font-size:16px;color:#eaf2ff;letter-spacing:1px;white-space:nowrap}
.sub{font-size:10px;color:#f5c542;border:1px solid rgba(245,197,66,.55);padding:0 5px;border-radius:3px;white-space:nowrap}
#stat{margin-left:auto;font-size:12px;color:#2ecc8f;white-space:nowrap}
#stat .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc8f;margin-right:5px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
#clk{font-size:12px;color:#9fb4d8;font-family:Consolas,monospace;white-space:nowrap}
.src{display:flex;gap:4px;align-items:center}
.src i{width:9px;height:9px;border-radius:2px}
.sg{background:#2ecc8f}.sr{background:#ff5b5b}
#btn{padding:5px 14px;border:0;border-radius:4px;background:linear-gradient(90deg,#17b3c9,#2e8bf5);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
#btn:disabled{opacity:.45;cursor:default}
.spend{font-size:12px;color:#8fa3c4;white-space:nowrap}
/* 主体 */
main{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
/* 左抽屉 */
#drw{width:220px;flex:none;background:rgba(255,255,255,.035);border:1px solid rgba(120,180,255,.14);border-radius:8px;display:flex;flex-direction:column;transition:width .2s;overflow:hidden}
#drw.coll{width:36px}
.dhd{height:32px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid rgba(120,180,255,.12)}
.dtt{font-size:12px;color:#9fb4d8;white-space:nowrap}
#dtog{margin-left:auto;width:22px;height:22px;border:0;border-radius:4px;background:rgba(120,180,255,.15);color:#cfe3ff;cursor:pointer;font-size:14px}
.dbody{flex:1;min-height:0;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px}
.dico{display:none;flex:1;flex-direction:column;align-items:center;gap:14px;padding-top:14px}
#drw.coll .dbody{display:none}
#drw.coll .dico{display:flex}
.dico span{width:22px;height:22px;line-height:22px;text-align:center;border-radius:4px;background:rgba(120,180,255,.15);color:#9fb4d8;font-size:12px}
.g-t{font-size:11px;color:#7c8aa5;margin-bottom:5px;white-space:nowrap}
.g-t em{font-style:normal;color:#4a5878;font-size:10px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.op{font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid rgba(120,180,255,.18);color:#9fb4d8;cursor:pointer;white-space:nowrap}
.op.sel{border-color:#35d0e8;color:#eaf6ff;box-shadow:0 0 6px rgba(53,208,232,.4)}
/* 中央地球 */
#cen{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#globe{width:100%;flex:1;min-height:0;display:block}
.lg{flex:none;display:flex;gap:12px;justify-content:center;font-size:11px;color:#9fb4d8}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.i1{background:#4d9de0}.i2{background:#8a63f5}.i3{background:#f5a623}.i4{background:#2ecc8f}
/* 右侧面板网格 2×3 */
#grid{width:min(600px,34vw);flex:none;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;min-height:0}
.panel{min-width:0;background:rgba(255,255,255,.035);border:1px solid rgba(120,180,255,.14);border-radius:8px;padding:7px;display:flex;flex-direction:column;min-height:0}
.pt{flex:none;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#9fb4d8;margin-bottom:6px}
.bd{font-size:10px;padding:0 5px;border-radius:3px;white-space:nowrap}
.bd.live{background:rgba(46,204,143,.18);color:#2ecc8f;border:1px solid rgba(46,204,143,.4)}
.bd.wait{background:rgba(245,166,35,.15);color:#f5a623;border:1px solid rgba(245,166,35,.4)}
.bd.na{background:rgba(107,122,148,.15);color:#7c8aa5;border:1px solid rgba(107,122,148,.4)}
.pc{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
/* 线索卡 */
.card{min-width:0;flex:1;background:rgba(22,40,72,.5);border:1px solid rgba(120,180,255,.12);border-left:3px solid #2e8bf5;border-radius:5px;padding:6px 8px}
.card.s1{border-left-color:#4d9de0}.card.s2{border-left-color:#8a63f5}.card.s3{border-left-color:#f5a623}.card.s4{border-left-color:#2ecc8f}
.card.off{border-left-color:#6b7a94;opacity:.6;background:rgba(60,72,92,.35)}
.ch{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.st{font-size:10px;padding:0 4px;border-radius:3px;color:#06121f;white-space:nowrap}
.st.s1{background:#4d9de0}.st.s2{background:#8a63f5}.st.s3{background:#f5a623}.st.s4{background:#2ecc8f}
.tg{font-size:10px;color:#9fb4d8;border:1px solid rgba(159,180,216,.4);padding:0 4px;border-radius:3px;white-space:nowrap}
.gr{font-size:10px;font-weight:700;width:15px;height:15px;line-height:15px;text-align:center;border-radius:3px;margin-left:auto;flex:none}
.a{background:#ff5b5b;color:#fff}.b{background:#f5a623;color:#1a1205}.c{background:#5a6b85;color:#e6edf7}
.fact{font-size:11px;color:#e6efff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.next{font-size:10px;color:#35d0e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.cf{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:#7c8aa5}
.ex{color:#ffb020}
/* 底栏 */
footer{height:28px;flex:none;display:flex;align-items:center;justify-content:center;gap:18px;font-size:11px;color:#7c8aa5;border-top:1px solid rgba(120,180,255,.12);white-space:nowrap}
footer b{color:#9fb4d8}
</style>
</head>
<body>
<header>
  <h1>热点采集网络</h1>
  <span class="sub">示例数据 · 布局稿</span>
  <span id="stat"><span class="dot"></span>运行中 · 已采集 128 条</span>
  <span id="clk"></span>
  <span class="src"><i class="sg" title="财联社"></i><i class="sg" title="新浪财经"></i><i class="sg" title="金十数据"></i><i class="sg" title="东方财富"></i><i class="sr" title="雪球"></i></span>
  <span class="spend">今日花费 ¥0.87</span>
  <button id="btn">一键采集</button>
</header>
<main>
  <aside id="drw">
    <div class="dhd"><span class="dtt">图层 / 筛选</span><button id="dtog">‹</button></div>
    <div class="dbody">
      <div><div class="g-t">时间窗 <em>单选 · 默认 3 小时</em></div>
        <div class="opts" data-g="time"><span class="op">1小时</span><span class="op">6小时</span><span class="op">24小时</span><span class="op sel">3小时</span><span class="op">48小时</span><span class="op">7天</span><span class="op">全部</span></div></div>
      <div><div class="g-t">阶段 <em>复选</em></div>
        <div class="opts" data-g="stage"><span class="op sel">S1 选品</span><span class="op sel">S2 供应链</span><span class="op sel">S3 交易结构</span><span class="op sel">S4 客户开发</span></div></div>
      <div><div class="g-t">行业 <em>复选</em></div>
        <div class="opts" data-g="ind"><span class="op sel">宠物经济</span><span class="op sel">母婴</span><span class="op sel">家居</span><span class="op sel">数码配件</span><span class="op sel">跨境物流</span><span class="op sel">其他</span></div></div>
      <div><div class="g-t">等级 <em>复选</em></div>
        <div class="opts" data-g="grade"><span class="op sel">A</span><span class="op sel">B</span><span class="op sel">C</span></div></div>
    </div>
    <div class="dico"><span>时</span><span>段</span><span>业</span><span>级</span></div>
  </aside>
  <section id="cen">
    <canvas id="globe"></canvas>
    <div class="lg"><span><i class="i1"></i>S1 选品</span><span><i class="i2"></i>S2 供应链</span><span><i class="i3"></i>S3 交易结构</span><span><i class="i4"></i>S4 客户开发</span></div>
  </section>
  <section id="grid">
    <section class="panel"><div class="pt"><span>新增（3h）</span><span class="bd live">实时</span></div><div class="pc" id="pNew"></div></section>
    <section class="panel"><div class="pt"><span>A 级线索</span><span class="bd live">实时</span></div><div class="pc" id="pA"></div></section>
    <section class="panel"><div class="pt"><span>S1 选品</span><span class="bd wait">待审</span></div><div class="pc" id="pS1"></div></section>
    <section class="panel"><div class="pt"><span>S3 交易结构</span><span class="bd wait">待审</span></div><div class="pc" id="pS3"></div></section>
    <section class="panel"><div class="pt"><span>更早</span><span class="bd wait">待审</span></div><div class="pc" id="pOld"></div></section>
    <section class="panel"><div class="pt"><span>已排除</span><span class="bd na">已排除</span></div><div class="pc" id="pEx"></div></section>
  </section>
</main>
<footer><span>v0.1 布局稿</span><b>光点 8</b><span>数据源 5/5</span><span>本轮 2m14s</span><span>示例数据 · 布局稿</span></footer>
<script>
const $=i=>document.getElementById(i);
// 面板数据：0阶段 1行业 2等级 3事实 4钱流 5时间 6下一步 7是否排除
const PAN={
pNew:[["S1 选品","宠物经济","A","出口宠物玩具小单询盘 3 笔，FOB 价差 15%","货款利差","14:32","先回 3 个询盘报 FOB 价"],["S2 供应链","宠物经济","A","本地宠物医院月耗 3 吨冻干粮，直供价差 12%","货款利差","13:05","联系采购要 1 吨试单"]],
pA:[["S4 客户开发","母婴","A","小区宝妈群 200 人求辅食带货，佣金 15%","佣金抽成","12:47","备 10 份试吃发群主"]],
pS1:[["S1 选品","数码配件","B","东莞电子厂尾单数据线 5 万条，账期 60 天","货款利差","12:02","要样品和库存清单"]],
pS3:[["S3 交易结构","母婴","C","外贸公司寻注塑模具厂，打样费垫资方案","垫资服务","11:30","报打样费垫资条件"]],
pOld:[["S4 客户开发","宠物经济","B","社区团购群主月销猫砂 800 袋，可分佣 8%","佣金抽成","昨日","约群主试发 1 箱猫砂"],["S1 选品","家居","B","夜市摊主日售手机壳 120 件，找源头批发","货款利差","昨日","寄 3 款样品谈批发价"]],
pEx:[["S2 供应链","宠物经济","C","跨境宠物食品清关需资质","已排除","昨日","",1]]
};
function cl(s){const c=s.slice(0,2).toLowerCase();return c==="s1"||c==="s2"||c==="s3"||c==="s4"?c:(s==="A"?"a":s==="B"?"b":"c");}
function cd(d){return '<div class="card '+(d[7]?'off ':'')+cl(d[0])+'"><div class="ch"><span class="st '+cl(d[0])+'">'+d[0]+'</span><span class="tg">'+d[1]+'</span><span class="gr '+cl(d[2])+'">'+d[2]+'</span></div><div class="fact">'+d[3]+'</div>'+(d[7]?'':'<div class="next">→ 下一步：'+d[6]+'</div>')+'<div class="cf"><span>'+(d[7]?'<span class="ex">需资质，已排除</span>':'钱流：'+d[4])+'</span><span>'+d[5]+'</span></div></div>';}
Object.keys(PAN).forEach(k=>PAN[k].forEach(d=>$(k).innerHTML+=cd(d)));
// 抽屉折叠
const drw=$("drw"),dtog=$("dtog");
dtog.onclick=()=>{drw.classList.toggle("coll");dtog.textContent=drw.classList.contains("coll")?"›":"‹";};
// 筛选假交互：时间窗单选，其余复选
document.querySelectorAll(".opts").forEach(o=>{const g=o.dataset.g;o.querySelectorAll(".op").forEach(op=>op.onclick=()=>{if(g==="time"){o.querySelectorAll(".op").forEach(x=>x.classList.remove("sel"));op.classList.add("sel");}else op.classList.toggle("sel");});});
// 时钟（UTC+8，每秒更新）
function clk(){const d=new Date(Date.now()+8*3600e3),p=n=>(n<10?"0":"")+n;$("clk").textContent="UTC+8 "+d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds());}
clk();setInterval(clk,1000);
// 一键采集
const btn=$("btn"),stat=$("stat");
btn.onclick=()=>{if(btn.disabled)return;btn.disabled=true;let n=0;stat.innerHTML='<span class="dot" style="background:#f5a623"></span>采集中 …';
const iv=setInterval(()=>{n++;stat.innerHTML='<span class="dot" style="background:#f5a623"></span>采集中 '+n+'s …';},1000);
setTimeout(()=>{clearInterval(iv);btn.disabled=false;stat.innerHTML='<span class="dot"></span>运行中 · 新增 3 条';},3000);};
// 地球 canvas：自转 + 经纬网 + 8 光点（S1 蓝 / S2 紫 / S3 橙 / S4 绿）+ 脉冲
const cv=$("globe"),x=cv.getContext("2d");let W,H,R;
function rs(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);R=Math.min(W,H)*.38;}
rs();addEventListener("resize",rs);
// 8 点分散亚欧美非：[纬度,经度,颜色]
const P=[[40,116,"#4d9de0"],[23,113,"#8a63f5"],[52,13,"#f5a623"],[0,20,"#f5a623"],[40,-75,"#4d9de0"],[48,2,"#8a63f5"],[33,-118,"#2ecc8f"],[-15,-48,"#2ecc8f"]];
const s=performance.now();let rot=-30;
function pr(lat,lon){const a=lat*Math.PI/180,b=(lon+rot)*Math.PI/180;return[Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)];}
function runs(pa){let o=[],c=[];for(const q of pa){const p=pr(q[0],q[1]);if(p[2]>0)c.push([p[0]*R,p[1]*R]);else{if(c.length)o.push(c);c=[];}}if(c.length)o.push(c);return o;}
function wire(pa,col){x.strokeStyle=col;x.lineWidth=1;for(const r of runs(pa)){x.beginPath();r.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();}}
function f(now){rot=-30+(now-s)/180;x.clearRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.beginPath();x.arc(0,0,R,0,7);x.clip();
const g=x.createRadialGradient(-R*.3,-R*.3,R*.1,0,0,R);g.addColorStop(0,"#16395f");g.addColorStop(1,"#071228");x.fillStyle=g;x.fillRect(-R,-R,2*R,2*R);
for(let lo=-180;lo<180;lo+=30){let a=[];for(let la=-90;la<=90;la+=6)a.push([la,lo]);wire(a,"rgba(100,170,255,.22)");}
for(let la=-60;la<=60;la+=30){let a=[];for(let lo=-180;lo<=180;lo+=6)a.push([la,lo]);wire(a,"rgba(100,170,255,.32)");}
P.forEach((p,i)=>{const q=pr(p[0],p[1]);if(q[2]<=0)return;const px=q[0]*R,py=q[1]*R,t=((now-s)/800+i*.17)%1;
x.strokeStyle=p[2];x.globalAlpha=.55*(1-t);x.lineWidth=1.4;x.beginPath();x.arc(px,py,R*(.015+.06*t),0,7);x.stroke();x.globalAlpha=1;
x.fillStyle=p[2];x.beginPath();x.arc(px,py,R*.017,0,7);x.fill();});
x.beginPath();x.arc(0,0,R,0,7);x.strokeStyle="rgba(120,180,255,.45)";x.lineWidth=1.5;x.stroke();
x.restore();requestAnimationFrame(f);}
requestAnimationFrame(f);
</script>
</body>
</html>
